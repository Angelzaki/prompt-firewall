name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Pytest
        run: pytest -q
      - name: Batch sobre samples
        run: python -m prompt_firewall batch --fail-under 0.95
      - name: Batch held-out
        run: python -m prompt_firewall batch --file samples/heldout.jsonl --out results/heldout --fail-under 0.80
      - name: llm-ci-gates batch principal (PASS)
        run: |
          pip install "git+https://github.com/Angelzaki/llm-ci-gates.git"
          python -m llm_ci_gates --metrics results/batch_report.json --thresholds ci/thresholds.yaml
      - name: llm-ci-gates held-out (PASS)
        run: python -m llm_ci_gates --metrics results/heldout/batch_report.json --thresholds ci/thresholds_heldout.yaml
      - name: Upload reporte
        uses: actions/upload-artifact@v4
        with:
          name: prompt-firewall-batch
          path: results/
